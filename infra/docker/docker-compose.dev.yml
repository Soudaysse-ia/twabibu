# Services de développement. Alternative à une installation Homebrew locale.
# Lancer : docker compose -f infra/docker/docker-compose.dev.yml up -d
# NON TESTÉ sur le poste d'origine (Docker absent le 12/11/2026) : à valider au premier usage.
name: twabibu-dev
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: twabibu
      POSTGRES_PASSWORD: twabibu
      POSTGRES_DB: twabibu_dev
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U twabibu -d twabibu_dev"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7
    ports: ["6379:6379"]
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: ["miniodata:/data"]
  mailpit:
    image: axllent/mailpit
    ports: ["1025:1025", "8025:8025"]
volumes:
  pgdata:
  miniodata:
